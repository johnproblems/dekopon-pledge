[workspace]

[package]
name = "dekopon-provider-pledge"
version = "0.2.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
description = "Durable commitments ledger provider for Dekopon agents: make, list, and settle promises"
repository = "https://github.com/johnproblems/dekopon-pledge"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
schemars = "=1.2.2"
dekopon-provider-sdk = "=0.46.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
dekopon-broker-host = "=0.46.1"
dekopon-capability = "=0.46.1"
dekopon-core = "=0.46.1"
dekopon-storage-host = "=0.46.1"
dekopon-provider-sdk-testkit = "=0.46.1"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
