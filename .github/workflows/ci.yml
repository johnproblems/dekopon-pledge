name: ci

on:
  push:
  pull_request:

jobs:
  pledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Install wasm-tools 1.259.0
        run: |
          curl -sL https://github.com/bytecodealliance/wasm-tools/releases/download/v1.259.0/wasm-tools-1.259.0-x86_64-linux.tar.gz -o /tmp/wasm-tools.tgz
          echo "3e9b374b4c7715b771b69bf0d65a337990ed4546ec5e97e01c0ff587dfc52160  /tmp/wasm-tools.tgz" | sha256sum -c -
          tar xzf /tmp/wasm-tools.tgz -C /tmp
          echo "/tmp/wasm-tools-1.259.0-x86_64-linux" >> "$GITHUB_PATH"

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Supply chain and unused deps
        run: |
          cargo install cargo-deny --version 0.20.2 --locked
          cargo install cargo-machete --version 0.9.2 --locked
          cargo deny check
          cargo machete

      - name: Build component
        run: scripts/build-component.sh pledge.wasm

      - name: Component size
        run: |
          size=$(wc -c <pledge.wasm)
          echo "pledge.wasm: $size bytes"
          test "$size" -lt 1048576

      - name: Test (unit, manifest, grammar, conformance, storage e2e)
        run: DEKOPON_PROVIDER_COMPONENT=$PWD/pledge.wasm cargo test --locked

      - name: Check example deployment configs
        run: |
          cargo install dekopon-brokerd --version 0.46.1 --locked
          cargo install dekopon-gatewayd --version 0.46.1 --locked
          cd examples/broker
          dekopon-brokerd check broker.yaml
          dekopon-gatewayd check gatewayd.yaml

      - name: Upload component
        uses: actions/upload-artifact@v4
        with:
          name: pledge-wasm
          path: |
            pledge.wasm
            pledge.wasm.sha256
