name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pledge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@a2627de80e5819949c7e1c83ed99b29085fc9bc4 # 1.98.1
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Install wasm-tools 1.259.0
        run: |
          curl -sL https://github.com/bytecodealliance/wasm-tools/releases/download/v1.259.0/wasm-tools-1.259.0-x86_64-linux.tar.gz -o /tmp/wasm-tools.tgz
          echo "3e9b374b4c7715b771b69bf0d65a337990ed4546ec5e97e01c0ff587dfc52160  /tmp/wasm-tools.tgz" | sha256sum -c -
          tar xzf /tmp/wasm-tools.tgz -C /tmp
          echo "/tmp/wasm-tools-1.259.0-x86_64-linux" >> "$GITHUB_PATH"

      - name: Cache cargo tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
          key: cargo-tools-deny-0.20.2-machete-0.9.2-brokerd-0.46.1-gatewayd-0.46.1

      - name: Install cargo tools
        run: |
          command -v cargo-deny >/dev/null 2>&1 || cargo install cargo-deny --version 0.20.2 --locked
          command -v cargo-machete >/dev/null 2>&1 || cargo install cargo-machete --version 0.9.2 --locked
          command -v dekopon-brokerd >/dev/null 2>&1 || cargo install dekopon-brokerd --version 0.46.1 --locked
          command -v dekopon-gatewayd >/dev/null 2>&1 || cargo install dekopon-gatewayd --version 0.46.1 --locked

      - name: CI gate
        run: make check

      - name: Check example deployment configs
        run: |
          cd examples/broker
          dekopon-brokerd check broker.yaml
          dekopon-gatewayd check gatewayd.yaml

      - name: Upload component
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pledge-wasm
          path: |
            pledge.wasm
            pledge.wasm.sha256
